name: Build & push — flotte SZH (desktop · admin · backup-verify)

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  schedule:
    # Quotidien : reconstruit pour récupérer les correctifs de sécurité de la base Fedora.
    - cron: '0 5 * * *'
  workflow_dispatch: {}

# Sérialise les builds (push + cron) : évite qu'un build concurrent remplace
# « latest » entre le push et la signature.
concurrency:
  group: build-push
  cancel-in-progress: false

env:
  IMAGE_DESKTOP: szh-silverblue-desktop
  IMAGE_ADMIN: szh-silverblue-admin
  IMAGE_BACKUP_VERIFY: szh-backup-verify

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # nécessaire pour pousser vers ghcr.io
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Définir registre + tags
        run: |
          echo "IMAGE_REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          # Tag daté <fedora>.<AAAAMMJJ> (ex. 44.20260620) : permet d'épingler un poste
          # sur une version connue et de cibler un rollback via `bootc switch`.
          FEDORA_VERSION=$(grep -oP '^ARG FEDORA_VERSION=\K\d+' images/szh-silverblue-desktop/Containerfile)
          echo "DATE_TAG=${FEDORA_VERSION}.$(date +%Y%m%d)" >> "$GITHUB_ENV"

      # --- Image DESKTOP (base de la famille bureau) -------------------------
      # Contexte = racine du dépôt (les Containerfiles font COPY common/ ET images/).
      - name: Build desktop (buildah)
        uses: redhat-actions/buildah-build@v2
        with:
          image: ${{ env.IMAGE_DESKTOP }}
          tags: latest ${{ github.sha }} ${{ env.DATE_TAG }}
          containerfiles: ./images/szh-silverblue-desktop/Containerfile
          context: .
          oci: true
          # vars.KDRIVE_URL = MOTIF d'URL de l'AppImage kDrive avec %VERSION%. Vide → omis.
          build-args: |
            KDRIVE_URL=${{ vars.KDRIVE_URL }}

      # --- Image ADMIN (dérive du desktop local → couches partagées) ---------
      - name: Build admin (buildah)
        uses: redhat-actions/buildah-build@v2
        with:
          image: ${{ env.IMAGE_ADMIN }}
          tags: latest ${{ github.sha }} ${{ env.DATE_TAG }}
          containerfiles: ./images/szh-silverblue-admin/Containerfile
          context: .
          oci: true
          # Dérive du desktop FRAÎCHEMENT construit (stockage local) → couches identiques.
          build-args: |
            BASE=localhost/${{ env.IMAGE_DESKTOP }}:latest

      # --- Image BACKUP-VERIFY (appliance headless, base fedora-bootc) -------
      - name: Build backup-verify (buildah)
        uses: redhat-actions/buildah-build@v2
        with:
          image: ${{ env.IMAGE_BACKUP_VERIFY }}
          tags: latest ${{ github.sha }} ${{ env.DATE_TAG }}
          containerfiles: ./images/szh-backup-verify/Containerfile
          context: .
          oci: true

      - name: Login ghcr.io
        uses: redhat-actions/podman-login@v1
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push desktop
        id: push-desktop
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ env.IMAGE_DESKTOP }}
          tags: latest ${{ github.sha }} ${{ env.DATE_TAG }}
          registry: ${{ env.IMAGE_REGISTRY }}

      - name: Push admin
        id: push-admin
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ env.IMAGE_ADMIN }}
          tags: latest ${{ github.sha }} ${{ env.DATE_TAG }}
          registry: ${{ env.IMAGE_REGISTRY }}

      - name: Push backup-verify
        id: push-backup-verify
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ env.IMAGE_BACKUP_VERIFY }}
          tags: latest ${{ github.sha }} ${{ env.DATE_TAG }}
          registry: ${{ env.IMAGE_REGISTRY }}

      # --- Signature cosign (par CLÉ ; activable via vars.COSIGN_ENABLED=true) ---
      # On signe le DIGEST retourné par l'étape de push (pas une résolution ultérieure
      # de « latest » → pas de course avec un autre build). Prérequis : secrets
      # SIGNING_SECRET + SIGNING_SECRET_PASSWORD ; clé publique committée (policy.json).
      - name: Installer cosign
        if: ${{ vars.COSIGN_ENABLED == 'true' }}
        uses: sigstore/cosign-installer@v3

      - name: Signer les images (par digest)
        if: ${{ vars.COSIGN_ENABLED == 'true' }}
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ${{ secrets.SIGNING_SECRET_PASSWORD }}
        run: |
          cosign sign -y --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE_REGISTRY}/${IMAGE_DESKTOP}@${{ steps.push-desktop.outputs.digest }}"
          cosign sign -y --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE_REGISTRY}/${IMAGE_ADMIN}@${{ steps.push-admin.outputs.digest }}"
          cosign sign -y --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE_REGISTRY}/${IMAGE_BACKUP_VERIFY}@${{ steps.push-backup-verify.outputs.digest }}"

# -----------------------------------------------------------------------------
# Variante registre AUTO-HÉBERGÉ (Forgejo) au lieu de ghcr.io :
#   - IMAGE_REGISTRY: forgejo.example.ch/<org>
#   - Remplacer le login par redhat-actions/podman-login avec
#     username/password = secrets pointant vers un compte de dépôt Forgejo.
# -----------------------------------------------------------------------------
