# =============================================================================
#  Randomisation MAC Wi-Fi (anti-tracking hors site).
#   - scan : MAC aléatoire à chaque scan (le poste ne révèle pas sa vraie MAC
#     en se promenant) ;
#   - connexion : MAC aléatoire STABLE PAR RÉSEAU (stable-ssid) → le bail DHCP
#     reste stable sur un réseau donné, mais deux réseaux différents voient deux
#     MAC différentes.
#  ETHERNET : volontairement NON randomisé (docks, NAC/réservations DHCP au bureau).
#  Source : https://github.com/secureblue/secureblue/tree/live/files/system/etc/NetworkManager/conf.d
#  Revert : hardening/reverts/revert_mac_randomization.sh
# =============================================================================
[device]
wifi.scan-rand-mac-address=yes

[connection]
wifi.cloned-mac-address=stable-ssid
