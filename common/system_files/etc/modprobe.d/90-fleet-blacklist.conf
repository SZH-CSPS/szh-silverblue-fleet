# =============================================================================
#  Blacklist de modules noyau — réduction de surface d'attaque (secureblue, CURATÉE).
#  « install … /bin/false » : bloque aussi le chargement explicite (plus fort que
#  « blacklist », qui n'empêche que l'auto-chargement par alias).
#
#  Source (liste exhaustive amont, à consulter pour les évolutions) :
#  https://github.com/secureblue/secureblue/blob/live/files/system/usr/lib/modprobe.d/secureblue.conf
#  Revert : hardening/reverts/revert_module_blacklist.sh
#
#  ÉCARTS VOLONTAIRES vs secureblue (décisions flotte, cf. hardening/README.md) :
#   - bluetooth/btusb : GARDÉS (casques, souris des utilisateurs)
#   - thunderbolt     : GARDÉ (docks ThinkPad ; le risque DMA sera couvert par IOMMU)
#   - nfs/cifs/sunrpc : GARDÉS (montages réseau kernel possibles côté IT)
#   - xfrm/esp/ah + l2tp : GARDÉS (compat VPN IPsec/L2TP d'entreprise éventuels)
#   - squashfs        : GARDÉ (inspection d'images live par les admins)
#   - uvcvideo        : jamais bloqué (webcams modernes) — seuls les pilotes de
#                       caméras LEGACY gspca sont bloqués
# =============================================================================

# --- Protocoles réseau exotiques (jamais utilisés sur un poste client) --------
install dccp /bin/false
install sctp /bin/false
install rds /bin/false
install tipc /bin/false
install n-hdlc /bin/false
install ax25 /bin/false
install netrom /bin/false
install x25 /bin/false
install rose /bin/false
install decnet /bin/false
install econet /bin/false
install af_802154 /bin/false
install ipx /bin/false
install appletalk /bin/false
install psnap /bin/false
install p8023 /bin/false
install p8022 /bin/false
install atm /bin/false
install rxrpc /bin/false
install batman-adv /bin/false
install 6lowpan /bin/false
install ieee802154_6lowpan /bin/false

