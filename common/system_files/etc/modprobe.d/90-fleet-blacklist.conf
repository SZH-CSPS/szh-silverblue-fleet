# --- Optique (aucun lecteur sur la flotte X13/T470s) ---------------------------
# ⚠️ Un lecteur DVD USB ne fonctionnera plus → revert_module_blacklist.sh si besoin.
install cdrom /bin/false
install sr_mod /bin/false

# --- Ports legacy : parallèle, disquette, joysticks gameport -------------------
install parport /bin/false
install parport_pc /bin/false
install ppdev /bin/false
install lp /bin/false
install floppy /bin/false
