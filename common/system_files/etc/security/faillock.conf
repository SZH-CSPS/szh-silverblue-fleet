# =============================================================================
#  Anti-bruteforce des connexions locales (pam_faillock) — politique flotte.
#  50 échecs en 15 min → compte verrouillé 24 h. Un utilisateur légitime n'atteint
#  jamais 50 ; un bruteforce physique est stoppé net. root N'EST PAS verrouillable
#  (pas de even_deny_root : garde une voie de secours admin).
#  Déverrouillage manuel par l'admin :  faillock --user <user> --reset
#  NB : ce fichier ne fait effet que si pam_faillock est dans la pile PAM —
#  assuré au build via authselect (bloc « faillock » dans build.sh).
#  Source : https://secureblue.dev/features (account lockout 50/24h)
#  Revert : hardening/reverts/revert_faillock.sh
# =============================================================================
audit
deny = 50
fail_interval = 900
unlock_time = 86400
