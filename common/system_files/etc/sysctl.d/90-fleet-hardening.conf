# =============================================================================
#  Durcissement noyau de la flotte — socle CONSERVATEUR (impact UX nul).
#  Appliqué au boot par systemd-sysctl.service (fichier déposé via system_files).
#
#  Sous-ensemble repris de secureblue, choisi COMPATIBLE KVM : on NE désactive PAS
#  les user namespaces et on NE blackliste PAS kvm/tun/bridge (le banc backup-verify
#  en a besoin pour ses VM de test). Aucun réglage ici n'affecte l'usage bureautique.
#
#  Migrera sous common/system_files/ en Phase 2 (cf. REDESIGN.md). Pour l'instant livré
#  dans l'image standard ; l'image admin en hérite.
# =============================================================================

# Masque les pointeurs noyau (/proc, dmesg) aux non-root → durcit les fuites d'adresses.
kernel.kptr_restrict=2
kernel.dmesg_restrict=1

# eBPF non privilégié interdit + durcissement du JIT (réduit la surface d'attaque noyau).
kernel.unprivileged_bpf_disabled=1
net.core.bpf_jit_harden=2

# Liens : empêche les attaques par lien dur/symbolique dans les répertoires en écriture
# partagée (ex. /tmp). Protège aussi FIFO et fichiers réguliers contre l'usage abusif.
fs.protected_hardlinks=1
fs.protected_symlinks=1
fs.protected_fifos=2
fs.protected_regular=2

# Pas de core dump pour les binaires setuid (fuite de secrets en mémoire).
fs.suid_dumpable=0

# ptrace limité aux processus enfants (un process compromis ne peut pas inspecter les
# autres process de l'utilisateur). Sans impact pour l'usage normal ; gêne seulement
# l'attache d'un débogueur à un process tiers (cas dev rare → relever ponctuellement).
kernel.yama.ptrace_scope=1
