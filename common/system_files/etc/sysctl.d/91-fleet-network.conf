# =============================================================================
#  Durcissement RÉSEAU (secureblue, sous-ensemble zéro-impact client).
#  Source : https://github.com/secureblue/secureblue/blob/live/files/system/usr/lib/sysctl.d/55-hardening.conf
#  Revert : hardening/reverts/revert_sysctl_network.sh
#  NON repris (volontaire) : drop_gratuitous_arp (casserait le failover VRRP de
#  passerelles), tcp_timestamps=0 et use_tempaddr=2 (impact inventaire IT — cf.
#  hardening/README.md), icmp_echo_ignore_all (fichier séparé 94, revert dédié).
# =============================================================================

# Anti SYN-flood + protection TIME-WAIT assassination (RFC 1337).
net.ipv4.tcp_syncookies=1
net.ipv4.tcp_rfc1337=1

# ICMP : ignore les echo broadcast (smurf) et les réponses d'erreur bogus.
net.ipv4.icmp_echo_ignore_broadcasts=1
net.ipv4.icmp_ignore_bogus_error_responses=1

# Anti-spoofing : reverse path filtering strict.
net.ipv4.conf.all.rp_filter=1
net.ipv4.conf.default.rp_filter=1

# Redirections ICMP : ni acceptées ni émises (un poste client ne route pas).
net.ipv4.conf.all.accept_redirects=0
net.ipv4.conf.default.accept_redirects=0
net.ipv6.conf.all.accept_redirects=0
net.ipv6.conf.default.accept_redirects=0
net.ipv4.conf.all.send_redirects=0
net.ipv4.conf.default.send_redirects=0

# Source routing : refusé (v4 + v6).
net.ipv4.conf.all.accept_source_route=0
net.ipv4.conf.default.accept_source_route=0
net.ipv6.conf.all.accept_source_route=0
net.ipv6.conf.default.accept_source_route=0

# Pas d'hypothèse « média partagé » (renforce le refus de redirects).
net.ipv4.conf.all.shared_media=0
net.ipv4.conf.default.shared_media=0

# ARP : réponses filtrées par interface + ignore les requêtes gratuites douteuses.
net.ipv4.conf.all.arp_filter=1
net.ipv4.conf.default.arp_filter=1
net.ipv4.conf.all.arp_ignore=2
net.ipv4.conf.default.arp_ignore=2

# Journalise les paquets martiens (spoofés / source-routés) — diagnostic.
net.ipv4.conf.all.log_martians=1
net.ipv4.conf.default.log_martians=1
