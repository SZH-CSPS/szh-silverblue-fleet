# =============================================================================
#  Durcissement NOYAU — surface d'attaque (secureblue, sous-ensemble zéro-impact).
#  Source : https://github.com/secureblue/secureblue/blob/live/files/system/usr/lib/sysctl.d/55-hardening.conf
#  Revert : hardening/reverts/revert_sysctl_kernel.sh
#  NON repris : fs.binfmt_misc=0 (casserait les builds multi-arch qemu sur admin),
#  kernel.panic=-1 (choix de dispo non tranché). perf_event → fichier 93 (revert dédié).
# =============================================================================

# Magic SysRq désactivé (accès console physique → actions noyau).
kernel.sysrq=0

# kexec interdit : empêche de remplacer le noyau à chaud (contourne Secure Boot).
kernel.kexec_load_disabled=1

# Pas d'auto-chargement des line disciplines TTY (vecteur d'élévation historique).
dev.tty.ldisc_autoload=0

# userfaultfd réservé à CAP_SYS_PTRACE (primitive fréquente dans les exploits UAF).
vm.unprivileged_userfaultfd=0

# io_uring désactivé : source majeure de CVE noyau ces dernières années ; rien
# n'en dépend sur la flotte (⚠️ certains serveurs modernes l'exploitent — sans objet ici).
kernel.io_uring_disabled=2

# Core dumps neutralisés au niveau noyau (complète systemd-coredump Storage=none
# + limits.d ; prioritaire sur /usr/lib/sysctl.d/50-coredump.conf, 92 > 50).
kernel.core_pattern=|/bin/false

# ASLR au maximum : entropie mmap 32 bits (max x86_64) + espace complet randomisé.
vm.mmap_rnd_bits=32
vm.mmap_rnd_compat_bits=16
kernel.randomize_va_space=2

# Déréférencement NULL inexploitables (page basse non mappable).
vm.mmap_min_addr=65536

# Beaucoup de mappings autorisés (défaut moderne, requis par certains outils/jeux).
vm.max_map_count=1048576

# Limite les oops/warnings répétés (un flot d'oops = tentative d'exploitation).
kernel.oops_limit=100
kernel.warn_limit=100

# Console silencieuse (niveau erreur) — cohérent avec rhgb/quiet.
kernel.printk=3 3 3 3
