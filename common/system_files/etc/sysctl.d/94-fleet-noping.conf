# Le poste ne répond PLUS au ping (v4 + v6) — furtivité sur le réseau.
# ⚠️ Si l'IT a besoin de ping-er les postes (monitoring/inventaire), reverter :
#     hardening/reverts/revert_ping_block.sh
# Source : secureblue 55-hardening.conf (icmp_echo_ignore_all).
net.ipv4.icmp_echo_ignore_all=1
net.ipv6.icmp.echo_ignore_all=1
