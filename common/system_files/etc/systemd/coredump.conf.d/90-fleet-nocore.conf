# Désactive le stockage des core dumps (systemd-coredump) sur toute la flotte.
# Un core dump peut contenir des secrets en clair (clés, mots de passe) ; sur des
# postes de bureau / un banc de vérif backup, on ne veut pas les conserver sur disque.
# Couplé à /etc/security/limits.d/90-fleet-nocore.conf (limite hard) et à
# fs.suid_dumpable=0 (sysctl).
[Coredump]
Storage=none
ProcessSizeMax=0
