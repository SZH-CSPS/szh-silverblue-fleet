# =============================================================================
#  Règles USBGuard du banc — minimales et lockout-safe.
#  Au 1er démarrage, tout périphérique PRÉSENT est autorisé (PresentDevicePolicy=allow
#  dans usbguard-daemon.conf). Les périphériques INSÉRÉS ensuite sont bloqués, sauf :
#
#  Le disque hors-site (dock USB) s'autorise À CHAQUE CAMPAGNE par l'opérateur :
#    usbguard list-devices          # repérer l'id du dock
#    usbguard allow-device <id>     # autoriser pour la session (pas permanent)
#
#  ⚠️ Syntaxe des règles à VALIDER sur le matériel (cf. TODO.md) : une règle invalide
#     empêche usbguard.service de démarrer.
# =============================================================================

# Périphériques d'interface humaine (clavier / souris USB) — évite tout lockout.
allow with-interface one-of { 03:00:01 03:01:01 03:00:00 03:01:00 }

# Jetons Yubico (YubiKey, vendor 1050) — clé GPG de déchiffrement des backups.
allow id 1050:*
