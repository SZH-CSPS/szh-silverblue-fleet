# =============================================================================
#  USBGuard — config du démon (banc backup-verify). Posture lockout-safe :
#  on AUTORISE tout ce qui est présent au démarrage (PresentDevicePolicy=allow →
#  ne verrouille pas le clavier / le matériel interne), et on BLOQUE les insertions
#  ultérieures sauf règles (rules.conf). Le dock USB du disque hors-site s'autorise
#  À CHAQUE CAMPAGNE par l'opérateur (usbguard list-devices / allow-device).
#  ⚠️ À VALIDER sur le matériel réel (cf. TODO.md).
# =============================================================================
RuleFile=/etc/usbguard/rules.conf
ImplicitPolicyTarget=block
PresentDevicePolicy=allow
PresentControllerPolicy=allow
InsertedDevicePolicy=apply-policy
RestoreControllerDeviceState=false
DeviceManagerBackend=uevent
# L'opérateur (groupe wheel) peut lister/autoriser des périphériques sans être root.
IPCAllowedUsers=root
IPCAllowedGroups=wheel
DeviceRulesWithPort=false
AuditBackend=LinuxAudit
HidePII=false
