# =============================================================================
#  Profil ADMIN : RÉAFFICHE le compte « admin » au login GDM.
#  L'image desktop le MASQUE (fleet-gdm-hide-admin.conf → SystemAccount=true) car là-bas
#  « admin » est un compte de gestion. Sur les postes ADMIN, « admin » est le compte de
#  TRAVAIL → il doit apparaître dans la liste GDM. On repasse donc SystemAccount à false.
#  (Le build.sh de l'image admin retire en plus le fichier de masquage hérité du desktop.)
#  f+ = (ré)écrit à CHAQUE boot → admin reste affiché même après une bascule depuis le desktop
#  (où /var/lib/AccountsService/users/admin pouvait déjà contenir SystemAccount=true).
# =============================================================================
f+ /var/lib/AccountsService/users/admin 0644 root root - [User]\nSystemAccount=false\n
