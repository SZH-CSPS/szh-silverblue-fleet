# Arguments noyau de la flotte, appliqués par bootc (usr/lib/bootc/kargs.d/*.toml).
# Les modifier ici les versionne avec l'image (cohérent sur toute la flotte)
# plutôt que via grubby poste par poste.
#
# PAS de rhgb/quiet (volontaire) : on veut le prompt LUKS/PIN en MODE TEXTE (console).
# Le prompt GRAPHIQUE Plymouth ne respecte pas le clavier suisse QWERTZ → il saisit en
# QWERTY (Z/Y inversés), ce qui casse la phrase de passe au clavier suisse. Le mode texte
# utilise le keymap console fr_CH (correct). Si Plymouth intercepte encore le clavier malgré
# l'absence de rhgb, ajouter "plymouth.enable=0" à la liste ci-dessous.
#
# rd.vconsole.keymap=fr_CH : force le keymap suisse romand DANS l'initramfs → l'invite
# LUKS/PIN au boot est en clavier suisse (et non QWERTY US). Pleinement effectif après
# la régénération locale de l'initramfs (fleet-initramfs-localize.service, 1er boot),
# qui embarque /etc/vconsole.conf. Voir aussi /etc/vconsole.conf.
#
# Mitigations CPU : on garde le défaut du noyau (mitigations=auto). N'ajouter
# "mitigations=auto,nosmt" (désactive l'hyperthreading, ~-20/30 % multi-thread)
# que si une politique de sécurité l'exige explicitement.
#
# Filtrer par architecture si nécessaire :  match-architectures = ["x86_64"]
kargs = ["rd.vconsole.keymap=fr_CH"]
